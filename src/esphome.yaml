esphome:
  name: tomato-moisture
  friendly_name: "Tomato Plant"

esp8266:
  board: nodemcuv2

# Enable logging (disable after debugging to save power)
logger:
  baud_rate: 0  # Disable serial logging

# Enable Home Assistant API
api:
  encryption:
    key: "GENERATE_WITH_ESPHOME"  # Auto-generated on first compile

ota:
  password: "YOUR_OTA_PASSWORD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "Tomato-Fallback"
    password: "fallback123"

captive_portal:

# Deep sleep - wake every 15 minutes, sleep for 14min 50s
deep_sleep:
  run_duration: 10s
  sleep_duration: 15min
  id: deep_sleep_1

# Sensor power control
switch:
  - platform: gpio
    id: sensor_power
    pin: D1
    internal: true

# Moisture sensor (on boot)
sensor:
  - platform: adc
    id: moisture_raw
    pin: A0
    update_interval: never  # We read manually
    filters:
      - offset: 0
      - multiply: 1

  - platform: template
    name: "Soil Moisture"
    id: soil_moisture
    unit_of_measurement: "%"
    icon: "mdi:water-percent"
    accuracy_decimals: 0
    # Calibration: replace 0.78 (dry) and 0.32 (wet) with YOUR voltage readings
    # The raw ADC on ESP8266 reads 0–1.0V → 0.0–1.0
    lambda: |-
      float raw = id(moisture_raw).state;
      // Map raw voltage to percentage (invert: lower voltage = wetter)
      float pct = (0.78 - raw) / (0.78 - 0.32) * 100.0;
      if (pct > 100.0) pct = 100.0;
      if (pct < 0.0) pct = 0.0;
      return pct;

  - platform: template
    name: "Moisture Raw ADC"
    id: moisture_adc_raw
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      return id(moisture_raw).state;

# Run on boot
interval:
  - interval: 1s
    then:
      - switch.turn_on: sensor_power
      - delay: 500ms
      - component.update: moisture_raw
      - delay: 100ms
      - switch.turn_off: sensor_power
      - deep_sleep.enter: deep_sleep_1
